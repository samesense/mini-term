# Mini Term touch session switcher (tmux 3.2+).
# Install the helper alongside this file in ~/.config/mini-term/ and source this
# after your normal tmux configuration on the remote Mac.
set-option -g mouse on
set-option -g @mini-term-menu-script "$HOME/.config/mini-term/tmux-session-menu.sh"
bind-key -n MouseDown1StatusLeft run-shell 'sh #{q:@mini-term-menu-script} #{q:socket_path} #{q:client_name}'
